[package]
name = "afg-live-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5.3", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"

# Absolute paths so the crate still resolves them after the instrumenter copies
# it into the run dir. afg-runtime is what the auto-inserted macros resolve to;
# afg_observe/afg_scheduler power the live /afg view.
afg-runtime = { path = "/Users/sanjib/codes/apace_lab/soap_afg_2026/repositories/AFG/afg_prototype/afg-runtime" }
afg_observe = { path = "/Users/sanjib/codes/apace_lab/soap_afg_2026/repositories/AFG/afg_prototype/afg_observe" }
afg_scheduler = { path = "/Users/sanjib/codes/apace_lab/soap_afg_2026/repositories/AFG/afg_prototype/afg_scheduler" }
