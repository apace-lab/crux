<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3240;
    --text:#e6edf3; --muted:#8b949e; --accent:#a371f7; --me:#2f81f7; --leak:#f85149;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; }

  /* sign-in */
  .signin { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px; width:360px; max-width:92vw; }
  .signin h1 { margin:0 0 4px; font-size:20px; }
  .signin p { margin:0 0 18px; color:var(--muted); font-size:13px; }
  .signin input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:11px 12px; font-size:14px; margin-bottom:10px; }
  .signin button { width:100%; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; }
  .hint { margin-top:16px; padding:11px 12px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; font-size:12px; color:var(--muted); }
  .hint b { color:var(--text); }
  .err { color:var(--leak); font-size:13px; min-height:18px; margin-bottom:6px; }

  /* chat */
  .app { display:none; flex-direction:column; width:640px; max-width:96vw; height:82vh; background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .top { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
  .top .who { font-weight:600; }
  .top .badge { color:var(--muted); font-size:12px; }
  .top .sp { margin-left:auto; }
  .top button { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:7px; padding:6px 11px; font-size:12px; cursor:pointer; }
  .msgs { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:78%; padding:10px 13px; border-radius:14px; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .me .bubble { background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .bot .bubble { background:var(--panel2); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .bubble .tag { display:block; margin-top:6px; font-size:11px; }
  .tag.cache { color:var(--muted); }
  .tag.leak { color:var(--leak); font-weight:700; }
  .composer { display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--border); }
  .composer input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14px; }
  .composer button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 16px; font-weight:600; cursor:pointer; }
  a.adminlink { position:fixed; top:12px; right:14px; color:var(--muted); font-size:12px; text-decoration:none; }
  a.adminlink:hover { color:var(--text); }
</style>
</head>
<body>
  <a class="adminlink" href="/admin" target="_blank">AFG console &#8599;</a>

  <div class="signin" id="signin">
    <h1>Assistant</h1>
    <p>Sign in to start chatting.</p>
    <div class="err" id="err"></div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="signinBtn">Sign in</button>
    <div class="hint">
      Demo accounts (hardcoded):<br>
      <b>alice@example.com</b> / alicepass<br>
      <b>bob@example.com</b> / bobpass<br>
      Open this page in two browsers, one per user.
    </div>
  </div>

  <div class="app" id="app">
    <div class="top">
      <span class="who" id="whoami"></span>
      <span class="badge">signed in</span>
      <span class="sp"></span>
      <button id="logout">Sign out</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <input id="prompt" placeholder="Ask the assistant&hellip;" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>

<script>
let token = null, email = null;

async function jpost(url, body) {
  const r = await fetch(url, { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(body||{}) });
  return r.json();
}

async function signin() {
  const e = document.getElementById("email").value.trim();
  const p = document.getElementById("password").value;
  const res = await jpost("/login", { email:e, password:p });
  if (!res.ok) { document.getElementById("err").textContent = res.error || "sign-in failed"; return; }
  token = res.token; email = res.email;
  document.getElementById("whoami").textContent = email;
  document.getElementById("signin").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("prompt").focus();
}

function addMsg(cls, text, tagHtml) {
  const row = document.createElement("div");
  row.className = "row " + cls;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  if (tagHtml) { const t = document.createElement("span"); t.innerHTML = tagHtml; b.appendChild(t); }
  row.appendChild(b);
  const box = document.getElementById("msgs");
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const inp = document.getElementById("prompt");
  const prompt = inp.value.trim();
  if (!prompt) return;
  inp.value = "";
  addMsg("me", prompt);
  const res = await jpost("/chat", { token, prompt });
  if (!res.ok) { addMsg("bot", "error: " + (res.error||"?")); return; }
  let tag = "";
  if (res.leaked_from) tag = `<span class="tag leak">&#9888; this answer was generated for ${res.leaked_from} (cross-user leak)</span>`;
  else if (res.cache_hit) tag = `<span class="tag cache">(from cache)</span>`;
  addMsg("bot", res.answer, tag);
}

document.getElementById("signinBtn").addEventListener("click", signin);
document.getElementById("password").addEventListener("keydown", e => { if (e.key==="Enter") signin(); });
document.getElementById("send").addEventListener("click", send);
document.getElementById("prompt").addEventListener("keydown", e => { if (e.key==="Enter") send(); });
document.getElementById("logout").addEventListener("click", () => location.reload());
</script>
</body>
</html>
