[package]
name = "afg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ll_parser = { path = "../ll-parser" }
afg_instrument = { path = "afg_instrument" }
afg_observe = { path = "afg_observe" }
afg_scheduler = { path = "afg_scheduler" }
