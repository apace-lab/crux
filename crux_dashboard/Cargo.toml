[package]
name = "crux_dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }

# The dashboard does the analysis itself, so it depends only on the pure CRUX
# analysis crates (siblings in afg_prototype). It never runs an app; it reads the
# trace / run-dir files any CRUX-instrumented app or pipeline run already writes.
crux_observe = { path = "../crux_observe" }
crux_cuie = { path = "../crux_cuie" }
